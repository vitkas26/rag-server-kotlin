ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [kg.vitkas.rag.server.ApplicationKt.module]
    }
}

ollama {
    url = "http://localhost:11434/api/embeddings"
    url = ${?OLLAMA_URL}
    model = "nomic-embed-text"
    model = ${?OLLAMA_MODEL}
    generationModel = "qwen2.5:7b-instruct"
    generationModel = ${?OLLAMA_GENERATION_MODEL}
}

rag {
    dbPath       = "rag_index.db"
    mdPath       = "syucai_knowledge_base.md"
    fixedSize    = 500
    fixedOverlap = 50
    sectionMax   = 800
    topK         = 5
}

anthropic {
    apiKey = ""
    apiKey = ${?ANTHROPIC_API_KEY}
    url = "https://api.anthropic.com/v1/messages"
    url = ${?ANTHROPIC_URL}
    model = "claude-haiku-4-5-20251001"
    model = ${?ANTHROPIC_MODEL}
    maxTokens = 1024
    maxTokens = ${?ANTHROPIC_MAX_TOKENS}
    version = "2023-06-01"
}

auth {
    user = "demo"
    user = ${?RAG_AUTH_USER}
    password = "demo123"
    password = ${?RAG_AUTH_PASSWORD}
}

docs {
    paths = "README.md,ANDROID_CLIENT_API.md,ARCHITECTURE.md"
    paths = ${?DOCS_PATHS}
}

mcp {
    baseUrl = "http://localhost:8080/mcp/git"
    baseUrl = ${?MCP_BASE_URL}
}

faq {
    path = "faq.md"
    path = ${?FAQ_PATH}
}

tickets {
    path = "tickets.json"
    path = ${?TICKETS_PATH}
}
