ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [kg.vitkas.rag.server.ApplicationKt.module]
    }
}

ollama {
    url = "http://localhost:11434/api/embeddings"
    url = ${?OLLAMA_URL}
    model = "nomic-embed-text"
    model = ${?OLLAMA_MODEL}
}

rag {
    dbPath       = "rag_index.db"
    mdPath       = "NURAi_technical_document.md"
    fixedSize    = 500
    fixedOverlap = 50
    sectionMax   = 800
    topK         = 5
}
