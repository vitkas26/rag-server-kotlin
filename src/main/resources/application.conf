ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [kg.vitkas.rag.server.ApplicationKt.module]
    }
}

ollama {
    url = "http://localhost:11434/api/embeddings"
    url = ${?OLLAMA_URL}
    model = "nomic-embed-text"
    model = ${?OLLAMA_MODEL}
}

rag {
    dbPath       = "rag_index.db"
    mdPath       = "syucai_knowledge_base.md"
    fixedSize    = 500
    fixedOverlap = 50
    sectionMax   = 800
    topK         = 5
}

anthropic {
    apiKey = ""
    apiKey = ${?ANTHROPIC_API_KEY}
    url = "https://api.anthropic.com/v1/messages"
    url = ${?ANTHROPIC_URL}
    model = "claude-haiku-4-5-20251001"
    model = ${?ANTHROPIC_MODEL}
    maxTokens = 1024
    maxTokens = ${?ANTHROPIC_MAX_TOKENS}
    version = "2023-06-01"
}
